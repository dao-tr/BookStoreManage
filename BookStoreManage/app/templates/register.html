{% extends 'layout/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-success text-white text-center font-weight-bold">
                <h4>ĐĂNG KÝ TÀI KHOẢN</h4>
            </div>
            <div class="card-body">
                {% if err_msg %}
                <div class="alert alert-danger">{{ err_msg }}</div>
                {% endif %}

                {% if success_msg %}
                <div class="alert alert-success">
                    {{ success_msg }} <a href="/login" class="alert-link">Đăng nhập ngay</a>
                </div>
                {% endif %}

                <form method="post">
                    <div class="form-group">
                        <label class="font-weight-bold">Họ và tên:</label>
                        <input type="text" name="name" class="form-control" placeholder="Nhập họ và tên..." required />
                    </div>
                    <div class="form-group">
                        <label class="font-weight-bold">Tên đăng nhập:</label>
                        <input type="text" name="username" class="form-control" placeholder="Nhập tên đăng nhập..." required />
                    </div>
                    <div class="form-group">
                        <label class="font-weight-bold">Mật khẩu:</label>
                        <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu..." required />
                    </div>
                    <div class="form-group">
                        <label class="font-weight-bold">Xác nhận mật khẩu:</label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Nhập lại mật khẩu..." required />
                    </div>
                    <button type="submit" class="btn btn-success btn-block font-weight-bold mt-4">ĐĂNG KÝ</button>
                </form>
            </div>
            <div class="card-footer text-center bg-light">
                <a href="/login" class="text-decoration-none">Đã có tài khoản? Đăng nhập tại đây</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
